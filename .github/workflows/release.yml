name: Publish Windows app
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version validée à publier (exemple : 0.10.1). Le tag vVERSION doit déjà exister.'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/v{0}', inputs.version) }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag and package version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:REQUESTED_VERSION -ne $version) { throw 'Requested version and package version differ' }
          $tagCommit = git rev-parse "v$version^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is missing' }
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw 'Checkout and release tag differ' }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*/*.exe
            release/*/*.blockmap
            release/*/latest.yml
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = Join-Path 'release' $version
          $installer = Join-Path $directory "Tchim-Draft-$version-win-x64.exe"
          $blockmap = "$installer.blockmap"
          $metadata = Join-Path $directory 'latest.yml'
          foreach ($file in @($installer, $blockmap, $metadata)) { if (-not (Test-Path -LiteralPath $file)) { throw "Missing $file" } }
          gh release create "v$version" --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Tchim Draft $version" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release' }
          gh release upload "v$version" $installer $blockmap $metadata --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete release remains a draft' }
          gh release edit "v$version" --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release' }
