Name}} Build, Runes & Counters Guide for {{championLane}} {{championName}} on LoL Patch {{patch}} are found on LoLalytics.","{{championName}} Build, Runes & Counters for {{championLane}} {{championName}}","{{championName}} {{championLane}} has a {{winrate}}% win rate in {{tier}} on Patch {{patch}}"," coming in at rank {{rank}} of {{rankTotal}} and graded {{tierlistTier}} Tier on the <a href=\"{{tierlistLink}}\">LoL Tierlist</a>","{{championName}} {{championLane}} is a strong counter to {{strong1}}, {{strong2}} & {{strong3}} while {{championName}} is countered most by {{weak1}}, {{weak2}} & {{weak3}}.","The best {{championName}} players have a {{topWr}}% win rate with an average rank of {{topElo}} on the <a href=\"{{leaderboardLink}}\">{{championName}} Leaderboard</a>. Below is a detailed breakdown of the {{championName}} build, runes & counters.","Home","Tier List","Leaderboard","Counters",{"build_head_title":"1ak","build_head_description":"1al","build_header_title":"1am","build_header_subtitle":"1am","build_header_description1":"1an","build_header_description2":"1ao","build_header_description3":"1ap","build_header_description4":"1aq","all_menu_Home":"1ar","all_menu_Tierlist":"1as","all_menu_Leaderboard":"1at","all_menu_Counters":"1au"},"We are the only League of Legends stats site to analyse every champion from every ranked game.<br />We include 100% of the champions played of every selected tier bracket in our analysis, we never include champions from outside the tier quoted tier.","Different tier brackets will have different average win rates so we now provide the average.<br />This will vary because unlike other stat sites we include 100% of a brackets champions played and never include champions that don't belong in the bracket.","Champion win rate and win rate delta. The win rate delta is the difference between the win rate using individual player tiers (LoLalytics chosen method) vs the win rate derived from using a game averaged tier (simpler method used by some other websites). LoLalytics data is based upon individual player tiers which includes all games by all players of a given bracket and doesn't include games from players outside the chosen bracket. LoLalytics chosen method provides the most accurate picture of how people of a given tier bracket are performing.","This tier ranking takes into account the win rate of ranked players of the analysed elo, the champions pick/ban influence ratio, the win rate and average rank of the best players on the champion.","Skill Priority is measured at level 10. It has a larger sample size than Skill Order but quotes lower win rates as it is measured much earlier. Due to being different measurement than Skill Order it may not match in cases where multiple Skill Orders are viable.","Skill Order is measured at level 15. It has a smaller sample size than Skill Priority and quotes higher win rates as it is measured much later in games with a higher proportion of the winning side having higher levels. Due to being different measurement than Skill Priority it may not match in cases where multiple Skill Orders are viable.","The quoted stats are for the Primary Keystone. For a detailed breakdown on all runes scroll down the page.","Delta 1 = Counter Matchup Win Rate - (100 - Counter Champions Overall Average Win Rate)<br />Positive values means the champion wins more against the matchup than the average champion does.","Delta 2 = Counter Matchup Win Rate - Normalised Champions Win Rate in Matchup<br />Positive values means the champion wins against the matchup more often than the normalised winrates would suggest.","<p>Synergy Delta = Actual Win Rate Together - (Current Champions Win Rate + Paired Champions Win Rate) / 2. The more positive the value the better the pairing performs than their win rates alone would suggest.</p>","<p>Normalised Synergy Delta = Actual Win Rate Together - Expected Normalised Champions Win Rate Together. The more positive the value the better the pairing performs than their normalised win rates alone would suggest.</p>","Exact Item Count. No more, No less are built for this statistic.","A Triples built item set with items: <div class=\"lolx-box\">A</div> > <div class=\"lolx-box\">B</div> > <div class=\"lolx-box\">C</div><br />Combines the following data to calculate the set statistics:<br /><div class=\"lolx-box\">A</div> > <div class=\"lolx-box\">B</div> > <div class=\"lolx-box\">C</div> 3 items built<br />and<br /><div class=\"lolx-box\">A</div> ><div class=\"lolx-box\">B</div> > <div class=\"lolx-box\">C</div> > <div class=\"lolx-box\">?</div> 4 items built<br />and<br /><div class=\"lolx-box\">A</div> > <div class=\"lolx-box\">B</div> > <div class=\"lolx-box\">C</div> > <div class=\"lolx-box\">?</div> > <div class=\"lolx-box\">?</div> 5 items built<br />These items sets are sorted by popularity and are a<br />reflection of what is built most often.","A Quad extrapolated item set with items:<br /><div class=\"lolx-box\">A</div> > <div class=\"lolx-box\">B</div> > <div class=\"lolx-box\">C</div> > <div class=\"lolx-box\">D</div><br />Combines the following data to calculate the set statistics:<br /><div class=\"lolx-box\">A</div> Exactly 1 Item<br />and<br /><div class=\"lolx-box\">A</div> > <div class=\"lolx-box\">B</div> Exactly 2 Items<br />and<br /><div class=\"lolx-box\">A</div> > <div class=\"lolx-box\">B</div> > <div class=\"lolx-box\">C</div> Exactly 3 Items<br />and<br /><div class=\"lolx-box\">A</div> > <div class=\"lolx-box\">B</div> > <div class=\"lolx-box\">C</div> > <div class=\"lolx-box\">D</div> Exactly 4 Items<br />These items sets are sorted by win rate and are extrapolated<br />from what summoners are potentially building.","Combines Actually Built and Extrapolated Set data into one",{"analysed":"1aw","averageWr":"1ax","avgWrDelta":"1ay","tier":"1az","skillPriority":"1b0","skillOrder":"1b1","quickRunes":"1b2","delta1":"1b3","delta2":"1b4","deltaSyn":"1b5","deltaSyn2":"1b6","exactSet":"1b7","builtSet"
